  - name: sunday_service
    label: Sunday service line
    required: false
    widget: string
  - name: cta_heading
    label: Bottom invitation heading
    required: false
    widget: string
  - name: cta_text
    label: Bottom invitation text
    required: false
    widget: text
- name: site
  label: Footer & site settings
  file: content/site.json
  preview_path: /
  fields:
  - name: church_name
    label: Church name (footer)
    required: false
    widget: string
  - name: footer_blurb
    label: Footer description
    required: false
    widget: text
  - name: email
    label: Email
    required: false
    widget: string
  - name: meeting_place
    label: Meeting place
    required: false
    widget: string
  - name: service_time
    label: Service time
    required: false
    widget: string
  - name: footer_tagline
    label: Footer closing line
    required: false
    widget: string
  - name: youtube
    label: YouTube link
    required: false
    widget: string
  - name: instagram
    label: Instagram link
    required: false
    widget: string
  - name: facebook
    label: Facebook link
    required: false
    widget: string
collections:
- name: pages
  label: Extra pages
  label_singular: page
  description: Extra pages built from sections. Tick “Show in the top menu” to add a page to the navigation.
  folder: content/pages
  format: json
  extension: json
  create: true
  delete: true
  slug: '{{title}}'
  identifier_field: title
  summary: '{{title}}'
  preview_path: /{{slug}}/
  fields:
  - name: title
    label: Page title
    hint: The web address is made from the title when the page is first created.
    required: true
    widget: string
  - name: eyebrow
    label: Small label above the title
    required: false
    widget: string
  - name: intro
    label: Intro text
    required: false
    widget: text
  - name: show_in_menu
    label: Show in the top menu
    required: false
    widget: boolean
  - name: menu_label
    label: Menu label (optional, defaults to the title)
    required: false
    widget: string
  - name: menu_order
    label: Menu position (1 = first)
    required: false
    widget: number
    value_type: int
  - name: published
    label: Published
    required: false
    default: true
    widget: boolean
  - name: sections
    label: Sections
    hint: Add, remove, and drag sections to build the page.
    required: false
    widget: list
    typeKey: type
    label_singular: section
    types:
    - name: text
      label: Text
      widget: object
      fields:
      - name: heading
        label: Heading (optional)
        required: false
        widget: string
      - name: body
        label: Text
        required: false
        widget: richtext
      - name: shaded
        label: Shaded background
        required: false
        widget: boolean
    - name: image_text
      label: Photo with text
      widget: object
      fields:
      - name: heading
        label: Heading (optional)
        required: false
        widget: string
      - name: body
        label: Text
        required: false
        widget: richtext
      - name: image
        label: Photo
        required: false
        widget: image
      - name: image_alt
        label: Photo description
        required: false
        widget: string
      - name: image_side
        label: Photo side
        required: false
        widget: select
        options:
        - label: Left
          value: left
        - label: Right
          value: right
      - name: shaded
        label: Shaded background
        required: false
        widget: boolean
    - name: columns
      label: Columns
      widget: object
      fields:
      - name: heading
        label: Heading (optional)
        required: false
        widget: string
      - name: columns
        label: Columns (2 or 3)
        required: false
        widget: list
        fields:
        - name: heading
          label: Heading
          required: false
          widget: string
        - name: text
          label: Text
          required: false
          widget: richtext
          editor_components: []
        max: 3
      - name: shaded
        label: Shaded background
        required: false
        widget: boolean
    - name: video
      label: YouTube video
      widget: object
      fields:
      - name: title
        label: Title
        required: false
        widget: string
      - name: youtube
        label: YouTube link
        required: false
        widget: string
      - name: shaded
        label: Shaded background
        required: false
        widget: boolean
    - name: cta
      label: Invitation banner with button
      widget: object
      fields:
      - name: heading
        label: Heading
        required: false
        widget: string
      - name: text
        label: Text
        required: false
        widget: text
      - name: button_label
        label: Button text
        required: false
        widget: string
      - name: button_link
        label: Button link
        required: false
        widget: string
    collapsed: false

