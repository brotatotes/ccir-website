app_title: CCIR website editor
site_url: https://ccir.brotatotes.com
display_url: https://ccir.brotatotes.com
show_preview_links: true
backend:
  name: github
  repo: brotatotes/ccir-website
  branch: main
  auth_methods:
  - token
media_folder: static/assets/img
public_folder: /assets/img
media_libraries:
  default:
    config:
      slugify_filename: true
slug:
  encoding: ascii
  clean_accents: true
field_defaults:
  richtext:
    modes:
    - rich_text
    buttons:
    - bold
    - italic
    - link
    - heading-two
    - heading-three
    - bulleted-list
    - numbered-list
    - quote
    editor_components:
    - image
    use_emoji_autocomplete: false
output:
  json:
    indent_size: 2
singletons:
- name: home
  label: Home page
  file: content/home.json
  preview_path: /
  fields:
  - name: hero
    label: Top banner
    required: false
    widget: object
    fields:
    - name: heading_intro
      label: Heading (first part)
      required: false
      widget: string
    - name: heading_highlight
      label: Heading (highlighted part)
      required: false
      widget: string
    - name: text
      label: Welcome text
      required: false
      widget: text
    - name: image
      label: Background photo
      required: false
      widget: image
    - name: image_alt
      label: Photo description (for screen readers)
      required: false
      widget: string
    - name: service_time
      label: Service time line
      required: false
      widget: string
    - name: location
      label: Location line
      required: false
      widget: string
  - name: who
    label: Who we are
    required: false
    widget: object
    fields:
    - name: eyebrow
      label: Small label above heading
      required: false
      widget: string
    - name: heading
      label: Heading
      required: false
      widget: string
    - name: text
      label: Text
      required: false
      widget: text
  - name: believe
    label: What we believe
    required: false
    widget: object
    fields:
    - name: eyebrow
      label: Small label above heading
      required: false
      widget: string
    - name: heading
      label: Heading
      required: false
      widget: string
    - name: image
      label: Photo
      required: false
      widget: image
    - name: image_alt
      label: Photo description
      required: false
      widget: string
    - name: body
      label: Text
      required: false
      widget: richtext
  - name: gatherings
    label: Weekly gatherings
    required: false
    widget: object
    fields:
    - name: eyebrow
      label: Small label above heading
      required: false
      widget: string
    - name: heading
      label: Heading
      required: false
      widget: string
    - name: cards
      label: Gatherings
      required: false
      widget: list
      fields:
      - name: title
        label: Name
        required: false
        widget: string
      - name: icon
        label: Icon
        required: false
        widget: select
        options:
        - label: Bible
          value: bible
        - label: House
          value: house
        - label: Prayer
          value: prayer
        - label: People
          value: people
        - label: Calendar
          value: calendar
      - name: times
        label: Times
        required: false
        widget: list
        fields:
        - name: day
          label: Day
          required: false
          widget: string
        - name: time
          label: Time
          required: false
          widget: string
        collapsed: false
        summary: '{{day}} · {{time}}'
      - name: note
        label: Note
        required: false
        widget: text
      collapsed: true
      summary: '{{title}}'
    - name: footer_note
      label: Note under the gatherings
      required: false
      widget: richtext
      editor_components: []
  - name: life
    label: Church life
    required: false
    widget: object
    fields:
    - name: eyebrow
      label: Small label above heading
      required: false
      widget: string
    - name: heading
      label: Heading
      required: false
      widget: string
    - name: columns
      label: Columns
      required: false
      widget: list
      fields:
      - name: heading
        label: Heading
        required: false
        widget: string
      - name: text
        label: Text
        required: false
        widget: text
      max: 3
      collapsed: true
      summary: '{{heading}}'
    - name: body
      label: Text below the columns
      required: false
      widget: richtext
  - name: gallery
    label: Photo gallery
    required: false
    widget: object
    fields:
    - name: eyebrow
      label: Small label above heading
      required: false
      widget: string
    - name: heading
      label: Heading
      required: false
      widget: string
    - name: photos
      label: Photos
      required: false
      widget: list
      fields:
      - name: image
        label: Photo
        required: false
        widget: image
      - name: alt
        label: Photo description
        required: false
        widget: string
      collapsed: true
      summary: '{{alt}}'
  - name: cta
    label: Bottom invitation
    required: false
    widget: object
    fields:
    - name: heading
      label: Heading
      required: false
      widget: string
    - name: text
      label: Text
      required: false
      widget: text
- name: messages
  label: Sunday Messages
  file: content/messages.json
  preview_path: /messages/
  fields:
  - name: videos
    label: Videos (newest first)
    hint: Paste the YouTube link for each video. Drag to reorder.
    required: false
    widget: list
    fields:
    - name: title
      label: Title
      required: true
      widget: string
    - name: youtube
      label: YouTube link
      required: true
      widget: string
    collapsed: true
    summary: '{{title}}'
  - name: eyebrow
    label: Small label above page title
    required: false
    widget: string
  - name: title
    label: Page title
    required: false
    widget: string
  - name: intro
    label: Intro text
    required: false
    widget: text
  - name: youtube_channel
    label: YouTube channel link
    required: false
    widget: string
  - name: cta_heading
    label: Bottom invitation heading
    required: false
    widget: string
  - name: cta_text
    label: Bottom invitation text
    required: false
    widget: text
