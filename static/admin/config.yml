  - name: intro
    label: Intro text
    required: false
    widget: text
  - name: points
    label: Points (numbered automatically)
    required: false
    widget: list
    fields:
    - name: heading
      label: Heading
      required: false
      widget: string
    - name: text
      label: Text
      required: false
      widget: text
    collapsed: true
    summary: '{{heading}}'
  - name: cta_heading
    label: Bottom invitation heading
    required: false
    widget: string
  - name: cta_text
    label: Bottom invitation text
    required: false
